name: build-exe

on:
  push:
    branches: [ main ]
    paths:
      - 'roblox_autorejoin.ahk'
      - 'AutoReconnectRoblox.ico'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler versão do script
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path roblox_autorejoin.ahk -Pattern 'VERSION\s*:=\s*"([^"]+)"' | Select-Object -First 1
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Versão: $v"

      - name: Instalar AutoHotkey v2 (inclui Ahk2Exe)
        shell: pwsh
        run: |
          $url = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.19/AutoHotkey_2.0.19_setup.exe"
          Invoke-WebRequest -Uri $url -OutFile ahk_setup.exe -UseBasicParsing
          Write-Host "Instalando AutoHotkey silenciosamente..."
          Start-Process -FilePath .\ahk_setup.exe -ArgumentList "/silent" -Wait
          Get-ChildItem -Recurse "$env:ProgramFiles\AutoHotkey" -Filter *.exe -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }

      - name: Compilar .exe
        shell: pwsh
        run: |
          $root    = "$env:ProgramFiles\AutoHotkey"
          $ahk2exe = Get-ChildItem -Recurse $root -Filter Ahk2Exe.exe    | Select-Object -First 1 -ExpandProperty FullName
          $base    = Get-ChildItem -Recurse $root -Filter AutoHotkey64.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $ahk2exe) { Write-Error "Ahk2Exe.exe nao encontrado"; exit 1 }
          if (-not $base)    { Write-Error "AutoHotkey64.exe nao encontrado"; exit 1 }
          Write-Host "Ahk2Exe: $ahk2exe"
          Write-Host "Base:    $base"
          & $ahk2exe /in roblox_autorejoin.ahk /out AutoReconnectRoblox.exe /base $base /icon AutoReconnectRoblox.ico
          if (!(Test-Path AutoReconnectRoblox.exe)) { Write-Error "Falhou ao gerar o .exe"; exit 1 }
          Write-Host "Gerado:" (Get-Item AutoReconnectRoblox.exe).Length "bytes"

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          files: AutoReconnectRoblox.exe
          fail_on_unmatched_files: true
