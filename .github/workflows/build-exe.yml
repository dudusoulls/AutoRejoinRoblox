name: build-exe

on:
  push:
    branches: [ main ]
    paths:
      - 'roblox_autorejoin.ahk'
      - 'AutoReconnectRoblox.ico'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler versão do script
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path roblox_autorejoin.ahk -Pattern 'VERSION\s*:=\s*"([^"]+)"' | Select-Object -First 1
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Versão: $v"

      - name: Baixar AutoHotkey v2 + Ahk2Exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path ahk | Out-Null
          # Base (AutoHotkey64.exe) direto do release oficial no GitHub
          Invoke-WebRequest -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.19/AutoHotkey_2.0.19.zip" -OutFile ahk\base.zip -UseBasicParsing
          Expand-Archive -Path ahk\base.zip -DestinationPath ahk\base -Force
          # Ahk2Exe: descobre o link do zip pela API do GitHub (sem Cloudflare aqui no runner)
          $rel = gh api repos/AutoHotkey/Ahk2Exe/releases/latest | ConvertFrom-Json
          Write-Host "Ahk2Exe release: $($rel.tag_name)"
          $asset = $rel.assets | Where-Object { $_.name -like '*.zip' } | Select-Object -First 1
          if (-not $asset) { Write-Error "Nenhum .zip no release do Ahk2Exe"; exit 1 }
          Write-Host "Baixando: $($asset.browser_download_url)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile ahk\a2e.zip -UseBasicParsing
          Expand-Archive -Path ahk\a2e.zip -DestinationPath ahk\compiler -Force
          Get-ChildItem -Recurse ahk -Filter *.exe | ForEach-Object { Write-Host $_.FullName }

      - name: Compilar .exe
        shell: pwsh
        run: |
          $ahk2exe = Get-ChildItem -Recurse ahk -Filter Ahk2Exe.exe     | Select-Object -First 1 -ExpandProperty FullName
          $base    = Get-ChildItem -Recurse ahk -Filter AutoHotkey64.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $ahk2exe) { Write-Error "Ahk2Exe.exe nao encontrado"; exit 1 }
          if (-not $base)    { Write-Error "AutoHotkey64.exe nao encontrado"; exit 1 }
          Write-Host "Ahk2Exe: $ahk2exe"
          Write-Host "Base:    $base"
          $args = @('/in','roblox_autorejoin.ahk','/out','AutoReconnectRoblox.exe','/base',$base,'/icon','AutoReconnectRoblox.ico','/silent','verbose')
          $p = Start-Process -FilePath $ahk2exe -ArgumentList $args -NoNewWindow -PassThru `
                 -RedirectStandardOutput a2e_out.txt -RedirectStandardError a2e_err.txt
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Error "Ahk2Exe travou (timeout)"; exit 1 }
          Write-Host "--- Ahk2Exe exit=$($p.ExitCode) ---"
          if (Test-Path a2e_out.txt) { Get-Content a2e_out.txt | ForEach-Object { Write-Host "OUT: $_" } }
          if (Test-Path a2e_err.txt) { Get-Content a2e_err.txt | ForEach-Object { Write-Host "ERR: $_" } }
          if (!(Test-Path AutoReconnectRoblox.exe)) { Write-Error "Falhou ao gerar o .exe"; exit 1 }
          Write-Host "Gerado:" (Get-Item AutoReconnectRoblox.exe).Length "bytes"

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          files: AutoReconnectRoblox.exe
          fail_on_unmatched_files: true
